<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球队积分兑换</title>
    <style>
        /* ... 保留原有所有样式 ... */
        .welcome-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 3000; }
        .welcome-box { background: #fff; border: 2px solid gold; padding: 40px 60px; text-align: center; }
        .welcome-box h2 { color: gold; font-size: 28px; margin-bottom: 10px; }
        .welcome-box p { font-size: 18px; }
        .welcome-box button { margin-top: 20px; background: #fff; color: #000; border: 1px solid #000; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <!-- ... 页面其他部分不变 ... -->

    <!-- 欢迎遮罩（初始隐藏） -->
    <div id="welcomeOverlay" class="welcome-overlay hidden">
        <div class="welcome-box">
            <h2>欢迎</h2>
            <p id="welcomeText"></p>
            <button onclick="skipWelcome()">跳过</button>
        </div>
    </div>

    <script>
        // ... 其他代码不变 ...

        // 修改后的登录函数
        async function loginUser() {
            var account = document.getElementById('accountInput').value.trim();
            var password = document.getElementById('passwordInput').value.trim();
            if (!account || !password) { alert('请输入账号和密码'); return; }
            try {
                var data = await apiFetch('/rest/v1/rpc/login_user', {
                    method: 'POST',
                    body: JSON.stringify({ p_account: account, p_password: password })
                });
                if (data && data.success) {
                    currentUser = { id: data.user_id, name: data.name, points: data.points, account: account };
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showWelcome(); // 只有手动登录才显示欢迎
                } else {
                    alert(data.msg || '账号或密码错误');
                }
            } catch (e) {
                console.error('登录失败:', e);
                alert('登录失败，请检查网络或配置');
            }
        }

        // 显示欢迎界面（10秒后自动进入，可手动跳过）
        function showWelcome() {
            var overlay = document.getElementById('welcomeOverlay');
            var text = document.getElementById('welcomeText');
            var yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            var dateStr = yesterday.toISOString().split('T')[0];

            // 设置10秒后自动关闭
            window.welcomeTimer = setTimeout(function() {
                if (!overlay.classList.contains('hidden')) {
                    overlay.classList.add('hidden');
                    showMainSection();
                }
            }, 10000);

            apiFetch('/rest/v1/daily_stats?select=*&user_id=eq.' + currentUser.id + '&stat_date=eq.' + dateStr)
                .then(function(data) {
                    var awards = [];
                    if (Array.isArray(data) && data.length > 0) {
                        var d = data[0];
                        if (d.champion > 0) awards.push('冠军');
                        if (d.runner_up > 0) awards.push('亚军');
                        if (d.third_place > 0) awards.push('季军');
                        if (d.golden_ball > 0) awards.push('金球奖');
                        if (d.golden_boot > 0) awards.push('金靴奖');
                        if (d.best_goal > 0) awards.push('最佳进球');
                    }
                    var awardText = awards.length > 0 ? awards.join('、') : '';
                    text.textContent = '欢迎，' + currentUser.name + '，昨天你获得' + (awardText || '。');
                    overlay.classList.remove('hidden');
                })
                .catch(function(e) {
                    console.error('获取昨日战绩失败:', e);
                    text.textContent = '欢迎，' + currentUser.name + '，昨天你获得。';
                    overlay.classList.remove('hidden');
                });
        }

        // 跳过欢迎界面
        function skipWelcome() {
            clearTimeout(window.welcomeTimer);
            var overlay = document.getElementById('welcomeOverlay');
            overlay.classList.add('hidden');
            showMainSection();
        }

        // 自动登录时直接进入主界面，不显示欢迎
        (function autoLogin() {
            var saved = localStorage.getItem('currentUser');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    showMainSection();
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        })();
    </script>
</body>
</html>
