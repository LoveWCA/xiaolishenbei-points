<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球队积分兑换</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background: #f5f5f5; padding: 20px; max-width: 800px; margin: 0 auto; }
        .container { background: #fff; border: 1px solid #000; padding: 20px; }
        .login-box { margin-bottom: 20px; }
        .login-box h3 { margin-bottom: 10px; font-weight: 600; color: #000; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #000; background: #fff; color: #000; font-size: 16px; }
        .login-box button { width: 100%; background: #000; color: #fff; border: 1px solid #000; padding: 10px; font-size: 16px; cursor: pointer; }
        .login-box button:hover { background: #fff; color: #000; }
        .hidden { display: none; }
        .warning-box { background: #f9f9f9; border: 1px solid #000; padding: 12px; margin-bottom: 15px; font-size: 14px; color: #000; text-align: center; font-weight: 500; }
        .points-card { background: #fff; border: 1px solid #000; padding: 30px; text-align: center; margin-bottom: 20px; }
        .points-label { font-size: 14px; opacity: 0.7; color: #000; }
        .points-value { font-size: 48px; font-weight: bold; margin-top: 10px; color: #000; }
        .section-title { font-size: 18px; font-weight: bold; color: #000; margin: 20px 0 10px; padding-bottom: 5px; border-bottom: 1px solid #000; }
        .prize-item, .record-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #ddd; }
        .prize-item:last-child, .record-item:last-child { border-bottom: none; }
        .prize-info, .record-info { display: flex; flex-direction: column; }
        .prize-name, .record-name { font-size: 16px; font-weight: bold; color: #000; }
        .prize-cost, .record-cost { font-size: 14px; color: #555; margin-top: 5px; }
        .prize-stock, .record-time { font-size: 12px; color: #777; margin-top: 3px; }
        .record-right { text-align: right; }
        .record-status { display: inline-block; font-size: 12px; color: #fff; margin-top: 5px; background: #000; padding: 2px 8px; }
        .quantity-selector { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 30px; height: 30px; background: #fff; border: 1px solid #000; cursor: pointer; font-size: 18px; line-height: 1; }
        .qty-btn:disabled { background: #ccc; border-color: #ccc; color: #666; cursor: not-allowed; }
        .qty-num { font-size: 18px; min-width: 30px; text-align: center; }
        .exchange-btn { background: #000; color: #fff; border: 1px solid #000; padding: 8px 16px; font-size: 14px; cursor: pointer; }
        .exchange-btn:hover:not(:disabled) { background: #fff; color: #000; }
        .exchange-btn:disabled { background: #ccc; color: #666; border-color: #ccc; cursor: not-allowed; }
        .empty, .loading { text-align: center; color: #888; padding: 20px; font-size: 14px; }
        .notice-box { margin-top: 20px; background: #f9f9f9; border: 1px solid #000; padding: 15px; max-height: 200px; overflow-y: auto; }
        .notice-box .notice-item { padding: 5px 0; font-size: 13px; border-bottom: 1px dashed #ccc; }
        .notice-box .notice-item:last-child { border-bottom: none; }
        .logout-btn, .nav-btn { background: #fff; color: #000; border: 1px solid #000; padding: 5px 10px; cursor: pointer; font-size: 14px; transition: background 0.2s, color 0.2s; }
        .logout-btn:hover, .nav-btn:hover, .nav-btn.active { background: #000; color: #fff; }
        .greeting { font-size: 18px; font-weight: bold; }
        .btn-group { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .nav-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        .nav-btn { margin: 0; }
        .account-box { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
        .account-box .divider { border-top: 1px solid #eee; margin: 15px 0; }
        .account-box input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #000; }
        .account-box button { background: #fff; color: #000; border: 1px solid #000; padding: 8px 16px; font-size: 14px; cursor: pointer; margin-right: 10px; }
        .account-box button:hover { background: #000; color: #fff; }
        .cup-info { font-size: 16px; line-height: 1.8; }
        .cup-stats { display: flex; flex-wrap: wrap; gap: 20px; margin: 20px 0; }
        .stat-group { flex: 1; min-width: 120px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; }
        .stat-label { font-size: 14px; color: #555; }
        .remark { margin-top: 20px; font-size: 14px; }
        .pdf-container { width: 100%; height: 500px; border: 1px solid #000; margin-top: 10px; }
        .faq-btn { background: #000; color: #fff; border: 1px solid #000; border-radius: 50%; width: 25px; height: 25px; line-height: 23px; text-align: center; cursor: pointer; display: inline-block; margin-left: 5px; }
        .prize-link { text-align: center; margin-top: 10px; }
        .prize-link a { color: #000; text-decoration: underline; cursor: pointer; }
        /* 密码输入框容器 */
        .password-wrapper { position: relative; margin-bottom: 10px; }
        .password-wrapper input { margin-bottom: 0; }
        .password-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; color: #000; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .points-value { font-size: 36px; }
            .prize-name, .record-name { font-size: 14px; }
            .section-title { font-size: 16px; }
            .nav-bar { gap: 5px; }
            .nav-btn { padding: 5px 8px; font-size: 13px; }
            .pdf-container { height: 300px; }
            .stat-number { font-size: 24px; }
            .quantity-selector { gap: 5px; }
            .qty-btn { width: 25px; height: 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录界面 -->
        <div id="loginSection" class="login-box">
            <h3>队员登录</h3>
            <div class="warning-box">各队员请勿使用移动数据，若发现超过1GB移动数据使用量，将扣除5个本赛季杯赛积分</div>
            <input type="text" id="accountInput" placeholder="账号">
            <!-- 密码输入框带眼睛 -->
            <div class="password-wrapper">
                <input type="password" id="passwordInput" placeholder="密码">
                <button class="password-toggle" onclick="togglePasswordVisibility('passwordInput', this)">👁</button>
            </div>
            <button onclick="loginUser()">登录</button>
        </div>

        <!-- 主界面（登录后显示） -->
        <div id="mainSection" class="hidden">
            <!-- 顶部：问候语和退出按钮 -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span class="greeting" id="greetingText">你好，</span>
                <button class="logout-btn" onclick="logoutUser()">退出</button>
            </div>
            <div class="warning-box">各队员请勿使用移动数据，若发现超过1GB移动数据使用量，将扣除5个本赛季杯赛积分</div>

            <!-- 导航栏 -->
            <div class="nav-bar">
                <button class="nav-btn active" data-page="home">首页</button>
                <button class="nav-btn" data-page="account">账号管理</button>
                <button class="nav-btn" data-page="cupInfo">本赛季杯赛情况</button>
                <button class="nav-btn" data-page="cupRules">本赛季杯赛规则</button>
                <button class="nav-btn" data-page="eventRules">本赛季积分兑换活动规则</button>
            </div>

            <!-- 内容区域 -->
            <!-- 首页 -->
            <div id="page-home" class="page">
                <div class="points-card">
                    <div class="points-label">我的积分</div>
                    <div class="points-value" id="pointsDisplay">0</div>
                </div>
                <div class="section-title">可兑换奖品</div>
                <div id="prizeList"><div class="loading">加载中...</div></div>
                <div class="prize-link">
                    <a href="#" onclick="switchPage('eventRules'); return false;">查看积分兑换规则</a>
                </div>
                <div class="section-title">我的兑换记录</div>
                <div id="recordList"><div class="loading">加载中...</div></div>
                <div class="section-title">管理员通知区</div>
                <div class="notice-box" id="noticeBox"><div class="loading">加载中...</div></div>
            </div>

            <!-- 账号管理 -->
            <div id="page-account" class="page hidden">
                <div class="section-title">账号管理</div>
                <div class="account-box">
                    <p><strong>修改用户名</strong></p>
                    <input type="text" id="newNameInput" placeholder="输入新用户名">
                    <button onclick="changeName()">确认修改</button>
                    <div class="divider"></div>
                    <p><strong>修改密码</strong></p>
                    <div class="password-wrapper">
                        <input type="password" id="oldPasswordInput" placeholder="输入原密码">
                        <button class="password-toggle" onclick="togglePasswordVisibility('oldPasswordInput', this)">👁</button>
                    </div>
                    <div class="password-wrapper">
                        <input type="password" id="newPasswordInput" placeholder="输入新密码">
                        <button class="password-toggle" onclick="togglePasswordVisibility('newPasswordInput', this)">👁</button>
                    </div>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPasswordInput" placeholder="确认新密码">
                        <button class="password-toggle" onclick="togglePasswordVisibility('confirmPasswordInput', this)">👁</button>
                    </div>
                    <button onclick="changePassword()">确认修改</button>
                </div>
            </div>

            <!-- 本赛季杯赛情况 -->
            <div id="page-cupInfo" class="page hidden">
                <div class="section-title">本赛季杯赛情况</div>
                <div class="cup-info" id="cupInfoContainer"><div class="loading">加载中...</div></div>
                <div class="remark">
                    当你5天内出现有3次冠军并净胜球46球，你可获得额外的5积分。
                    <span class="faq-btn" onclick="alert('解释：在5天内获得3次冠军并且总净胜球达到46球，可额外获得5积分。')">?</span>
                </div>
                <div class="remark" style="margin-top:5px;">申请请在商品兑换页查看。</div>
            </div>

            <!-- 本赛季杯赛规则 -->
            <div id="page-cupRules" class="page hidden">
                <div class="section-title">本赛季杯赛规则</div>
                <p style="margin-bottom: 10px;">查看杯赛规则 PDF：</p>
                <iframe class="pdf-container" src="https://example.com/cup_rules.pdf" title="本赛季杯赛规则"></iframe>
            </div>

            <!-- 本赛季积分兑换活动规则 -->
            <div id="page-eventRules" class="page hidden">
                <div class="section-title">本赛季积分兑换活动规则</div>
                <p style="margin-bottom: 10px;">查看积分兑换规则 PDF：</p>
                <iframe class="pdf-container" src="https://example.com/exchange_rules.pdf" title="本赛季积分兑换活动规则"></iframe>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        var SUPABASE_URL = 'https://hjktfecloctfpaoohzax.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqa3RmZWNsb2N0ZnBhb29oemF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQ5MzksImV4cCI6MjEwMjQ2MDkzOX0.Kd94mBz7-2EX9Xu3HZUKawIgUWCrVbFsH7rXFyz7WUg';

        function getHeaders() {
            return {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json'
            };
        }

        async function apiFetch(path, options) {
            options = options || {};
            options.headers = getHeaders();
            var response = await fetch(SUPABASE_URL + path, options);
            if (!response.ok) {
                var errorText = await response.text();
                console.error('API错误 ' + response.status + ':', errorText);
                throw new Error('API错误 ' + response.status);
            }
            return await response.json();
        }

        var currentUser = null;
        var userUsage = {};
        var selectedQty = {};

        // ==================== 密码可见性切换 ====================
        function togglePasswordVisibility(inputId, btn) {
            var input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁';
            }
        }

        // ==================== 导航切换函数 ====================
        function switchPage(page) {
            document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
            var activeBtn = document.querySelector('.nav-btn[data-page="' + page + '"]');
            if (activeBtn) activeBtn.classList.add('active');
            document.querySelectorAll('.page').forEach(function(p) { p.classList.add('hidden'); });
            document.getElementById('page-' + page).classList.remove('hidden');
            if (page === 'cupInfo') {
                loadCupInfo();
            }
            if (page === 'home') {
                loadAll();
            }
        }

        // ==================== 导航按钮事件 ====================
        document.querySelectorAll('.nav-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                switchPage(btn.getAttribute('data-page'));
            });
        });

        // ==================== 登录 ====================
        async function loginUser() {
            var account = document.getElementById('accountInput').value.trim();
            var password = document.getElementById('passwordInput').value.trim();
            if (!account || !password) {
                alert('请输入账号和密码');
                return;
            }

            try {
                var data = await apiFetch('/rest/v1/rpc/login_user', {
                    method: 'POST',
                    body: JSON.stringify({ p_account: account, p_password: password })
                });

                if (data && data.success) {
                    currentUser = {
                        id: data.user_id,
                        name: data.name,
                        points: data.points
                    };
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showMainSection();
                } else {
                    alert(data.msg || '账号或密码错误');
                }
            } catch (e) {
                console.error('登录失败:', e);
                alert('登录失败，请检查网络或配置');
            }
        }

        function showMainSection() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('greetingText').textContent = '你好，' + currentUser.name;
            document.getElementById('pointsDisplay').textContent = currentUser.points;
            loadAll();
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('accountInput').value = '';
            document.getElementById('passwordInput').value = '';
            // 重置导航到首页
            switchPage('home');
        }

        // ==================== 修改密码（使用表单输入） ====================
        async function changePassword() {
            var oldPassword = document.getElementById('oldPasswordInput').value.trim();
            var newPassword = document.getElementById('newPasswordInput').value.trim();
            var confirmPassword = document.getElementById('confirmPasswordInput').value.trim();
            if (!oldPassword || !newPassword || !confirmPassword) {
                alert('请填写所有密码字段');
                return;
            }
            if (newPassword !== confirmPassword) {
                alert('两次输入的新密码不一致');
                return;
            }

            try {
                var data = await apiFetch('/rest/v1/rpc/update_password', {
                    method: 'POST',
                    body: JSON.stringify({
                        p_user_id: currentUser.id,
                        p_old_password: oldPassword,
                        p_new_password: newPassword
                    })
                });
                if (data && data.success) {
                    alert('密码修改成功，请重新登录');
                    logoutUser();
                } else {
                    alert(data.msg || '修改失败');
                }
            } catch (e) {
                console.error('修改密码失败:', e);
                alert('修改失败，请重试');
            }
        }

        // ==================== 修改用户名（使用表单输入） ====================
        async function changeName() {
            var newName = document.getElementById('newNameInput').value.trim();
            if (!newName) {
                alert('请输入新用户名');
                return;
            }

            try {
                var data = await apiFetch('/rest/v1/rpc/update_name', {
                    method: 'POST',
                    body: JSON.stringify({
                        p_user_id: currentUser.id,
                        p_new_name: newName
                    })
                });
                if (data && data.success) {
                    currentUser.name = data.new_name || newName;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    document.getElementById('greetingText').textContent = '你好，' + currentUser.name;
                    document.getElementById('newNameInput').value = '';
                    alert('用户名修改成功');
                } else {
                    alert(data.msg || '修改失败');
                }
            } catch (e) {
                console.error('修改用户名失败:', e);
                alert('修改失败，请重试');
            }
        }

        // ==================== 加载用户已兑换数量 ====================
        async function loadUserUsage() {
            if (!currentUser) return;
            try {
                var data = await apiFetch('/rest/v1/exchanges?user_id=eq.' + currentUser.id + '&select=prize_id,quantity,created_at');
                userUsage = {};
                data.forEach(function(record) {
                    var prizeId = record.prize_id;
                    userUsage[prizeId] = (userUsage[prizeId] || 0) + record.quantity;
                });
            } catch (e) {
                console.error('加载用户兑换情况失败:', e);
            }
        }

        // ==================== 加载奖品列表 ====================
        async function loadPrizes() {
            var container = document.getElementById('prizeList');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                await loadUserUsage();

                var data = await apiFetch('/rest/v1/prizes?select=*&order=cost.asc');
                if (Array.isArray(data) && data.length > 0) {
                    container.innerHTML = data.map(function(p) {
                        var purchaseLimit = p.purchase_limit || 0;
                        var alreadyUsed = userUsage[p.id] || 0;
                        var remaining = purchaseLimit > 0 ? Math.max(purchaseLimit - alreadyUsed, 0) : 999999;
                        var canAdd = remaining > 0 && p.stock > 0;
                        var isLocked = purchaseLimit > 0 && remaining <= 0;
                        var stockText = purchaseLimit > 0 ? '限购 ' + purchaseLimit + ' 次，已兑 ' + alreadyUsed + ' 次' : '剩余 ' + p.stock + ' 件';

                        var extraRemark = '';
                        if (p.name === '【申请】5天内已出现3次冠军、46净胜球，申领积分') {
                            extraRemark = '<div style="color:#888; font-size:12px; margin-top:3px;">合理申请，请勿多加。</div>';
                        }

                        return '<div class="prize-item">' +
                            '<div class="prize-info">' +
                                '<div class="prize-name">' + p.name + '</div>' +
                                '<div class="prize-cost">' + p.cost + ' 积分</div>' +
                                '<div class="prize-stock">' + stockText + '</div>' +
                                extraRemark +
                            '</div>' +
                            '<div class="quantity-selector">' +
                                '<button class="qty-btn" onclick="changeQty(\'' + p.id + '\', -1)" ' + (!canAdd ? 'disabled' : '') + '>−</button>' +
                                '<span class="qty-num" id="qty-' + p.id + '">' + (selectedQty[p.id] || 0) + '</span>' +
                                '<button class="qty-btn" onclick="changeQty(\'' + p.id + '\', 1)" ' + (!canAdd ? 'disabled' : '') + '>+</button>' +
                            '</div>' +
                            '<button class="exchange-btn" onclick="exchangePrize(\'' + p.id + '\')" ' + (!canAdd ? 'disabled' : '') + '>' + (isLocked ? '已达上限' : '兑换') + '</button>' +
                            '</div>';
                    }).join('');
                } else {
                    container.innerHTML = '<div class="empty">暂无奖品</div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="empty">加载奖品失败</div>';
            }
        }

        // ==================== 数量加减 ====================
        function changeQty(prizeId, delta) {
            var current = selectedQty[prizeId] || 0;
            var newQty = current + delta;
            if (newQty < 0) newQty = 0;
            selectedQty[prizeId] = newQty;
            document.getElementById('qty-' + prizeId).textContent = newQty;
        }

        // ==================== 兑换 ====================
        async function exchangePrize(prizeId) {
            if (!currentUser) return;
            var quantity = selectedQty[prizeId] || 0;
            if (quantity < 1) {
                alert('请选择兑换数量');
                return;
            }
            if (!confirm('确定兑换该奖品吗？数量：' + quantity)) return;

            try {
                var data = await apiFetch('/rest/v1/rpc/exchange_prize', {
                    method: 'POST',
                    body: JSON.stringify({ p_user_id: currentUser.id, p_prize_id: prizeId, p_quantity: quantity })
                });

                if (data && data.success) {
                    alert('兑换成功！');
                    currentUser.points -= data.total_cost;
                    document.getElementById('pointsDisplay').textContent = currentUser.points;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    selectedQty[prizeId] = 0;
                    document.getElementById('qty-' + prizeId).textContent = '0';
                    loadPrizes();
                    loadRecords();
                    loadNotices();
                } else {
                    alert(data.msg || '兑换失败');
                }
            } catch (e) {
                console.error('兑换失败:', e);
                alert('兑换失败，请重试');
            }
        }

        // ==================== 加载兑换记录 ====================
        async function loadRecords() {
            var container = document.getElementById('recordList');
            if (!currentUser) return;
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                var data = await apiFetch('/rest/v1/exchanges?user_id=eq.' + currentUser.id + '&select=*&order=created_at.desc');
                if (Array.isArray(data) && data.length > 0) {
                    container.innerHTML = data.map(function(r) {
                        return '<div class="record-item">' +
                            '<div class="record-info">' +
                                '<div class="record-name">' + r.prize_name + ' x' + r.quantity + '</div>' +
                                '<div class="record-time">' + new Date(r.created_at).toLocaleString() + '</div>' +
                            '</div>' +
                            '<div class="record-right">' +
                                '<div class="record-cost">-' + r.total_cost + ' 积分</div>' +
                                '<span class="record-status">' + r.status + '</span>' +
                            '</div>' +
                            '</div>';
                    }).join('');
                } else {
                    container.innerHTML = '<div class="empty">暂无兑换记录</div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="empty">加载记录失败</div>';
            }
        }

        // ==================== 加载通知 ====================
        async function loadNotices() {
            var container = document.getElementById('noticeBox');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                var data = await apiFetch('/rest/v1/exchanges?select=*&order=created_at.desc&limit=20');
                if (Array.isArray(data) && data.length > 0) {
                    container.innerHTML = data.map(function(n) {
                        return '<div class="notice-item">【' +
                            new Date(n.created_at).toLocaleString() + '】' +
                            n.prize_name + ' x' + n.quantity + '，消耗' + n.total_cost + '积分</div>';
                    }).join('');
                } else {
                    container.innerHTML = '<div class="empty">暂无兑换请求</div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="empty">加载通知失败</div>';
            }
        }

        // ==================== 加载杯赛情况 ====================
        async function loadCupInfo() {
            var container = document.getElementById('cupInfoContainer');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                var data = await apiFetch('/rest/v1/cup_info?select=*&limit=1');
                if (Array.isArray(data) && data.length > 0) {
                    var info = data[0];
                    container.innerHTML = '' +
                        '<div class="cup-stats">' +
                            '<div class="stat-group"><div class="stat-number">' + info.champion + '</div><div class="stat-label">冠军</div></div>' +
                            '<div class="stat-group"><div class="stat-number">' + info.runner_up + '</div><div class="stat-label">亚军</div></div>' +
                            '<div class="stat-group"><div class="stat-number">' + info.third_place + '</div><div class="stat-label">季军</div></div>' +
                            '<div class="stat-group"><div class="stat-number">' + info.golden_ball + '</div><div class="stat-label">金球奖</div></div>' +
                            '<div class="stat-group"><div class="stat-number">' + info.golden_boot + '</div><div class="stat-label">金靴奖</div></div>' +
                            '<div class="stat-group"><div class="stat-number">' + info.best_goal + '</div><div class="stat-label">最佳进球</div></div>' +
                        '</div>';
                } else {
                    container.innerHTML = '<div class="empty">暂无数据</div>';
                }
            } catch (e) {
                console.error('加载杯赛情况失败:', e);
                container.innerHTML = '<div class="empty">加载失败</div>';
            }
        }

        // ==================== 加载所有数据 ====================
        function loadAll() {
            loadPrizes();
            loadRecords();
            loadNotices();
        }

        // ==================== 自动登录 ====================
        (function autoLogin() {
            var saved = localStorage.getItem('currentUser');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    showMainSection();
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        })();
    </script>
</body>
</html>
