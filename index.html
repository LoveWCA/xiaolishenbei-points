<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>登录测试</title>
</head>
<body>
    <div id="loginSection">
        <h3>队员登录</h3>
        <input type="text" id="accountInput" placeholder="账号">
        <input type="password" id="passwordInput" placeholder="密码">
        <button onclick="loginUser()">登录</button>
    </div>
    <div id="mainSection" style="display:none;">
        <h3>欢迎，<span id="userName"></span></h3>
        <p>你的积分：<span id="pointsDisplay"></span></p>
        <button onclick="logoutUser()">退出</button>
    </div>

    <script>
        var SUPABASE_URL = 'https://hjktfecloctfpaoohzax.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqa3RmZWNsb2N0ZnBhb29oemF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQ5MzksImV4cCI6MjEwMjQ2MDkzOX0.Kd94mBz7-2EX9Xu3HZUKawIgUWCrVbFsH7rXFyz7WUg';

        function getHeaders() {
            return {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json'
            };
        }

        var currentUser = null;

        async function loginUser() {
            var account = document.getElementById('accountInput').value.trim();
            var password = document.getElementById('passwordInput').value.trim();
            if (!account || !password) { alert('请输入账号和密码'); return; }

            var response = await fetch(SUPABASE_URL + '/rest/v1/rpc/login_user', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ p_account: account, p_password: password })
            });
            var data = await response.json();

            if (data && data.success) {
                currentUser = data;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('mainSection').style.display = 'block';
                document.getElementById('userName').textContent = data.name;
                document.getElementById('pointsDisplay').textContent = data.points;
            } else {
                alert(data.msg || '账号或密码错误');
            }
        }

        function logoutUser() {
            currentUser = null;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('mainSection').style.display = 'none';
        }
    </script>
</body>
</html>
