<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球队积分兑换</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background: #f5f5f5; padding: 20px; max-width: 600px; margin: 0 auto; }
        .container { background: #fff; border: 1px solid #000; padding: 20px; }
        .login-box { margin-bottom: 20px; }
        .login-box h3 { margin-bottom: 10px; font-weight: 600; color: #000; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #000; background: #fff; color: #000; font-size: 16px; transition: border-color 0.2s; }
        .login-box input:focus { outline: none; border-color: #555; }
        .login-box button { width: 100%; background: #000; color: #fff; border: 1px solid #000; padding: 10px; font-size: 16px; cursor: pointer; transition: background 0.2s, color 0.2s, transform 0.1s; }
        .login-box button:hover { background: #fff; color: #000; }
        .login-box button:active { transform: scale(0.98); }
        .hidden { display: none; }
        .warning-box { background: #f9f9f9; border: 1px solid #000; padding: 12px; margin-bottom: 15px; font-size: 14px; color: #000; text-align: center; font-weight: 500; }
        .points-card { background: #fff; border: 1px solid #000; padding: 30px; text-align: center; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .points-label { font-size: 14px; opacity: 0.7; color: #000; }
        .points-value { font-size: 48px; font-weight: bold; margin-top: 10px; color: #000; }
        .section-title { font-size: 18px; font-weight: bold; color: #000; margin: 20px 0 10px; padding-bottom: 5px; border-bottom: 1px solid #000; }
        .prize-item, .record-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #ddd; }
        .prize-item:last-child, .record-item:last-child { border-bottom: none; }
        .prize-info, .record-info { display: flex; flex-direction: column; }
        .prize-name, .record-name { font-size: 16px; font-weight: bold; color: #000; }
        .prize-cost, .record-cost { font-size: 14px; color: #555; margin-top: 5px; }
        .prize-stock, .record-time { font-size: 12px; color: #777; margin-top: 3px; }
        .record-right { text-align: right; }
        .record-status { display: inline-block; font-size: 12px; color: #fff; margin-top: 5px; background: #000; padding: 2px 8px; }
        .exchange-btn { background: #000; color: #fff; border: 1px solid #000; padding: 8px 16px; font-size: 14px; cursor: pointer; transition: background 0.2s, color 0.2s, transform 0.1s; }
        .exchange-btn:hover:not(:disabled) { background: #fff; color: #000; }
        .exchange-btn:active:not(:disabled) { transform: scale(0.95); }
        .exchange-btn:disabled { background: #ccc; color: #666; border-color: #ccc; cursor: not-allowed; }
        .empty, .loading { text-align: center; color: #888; padding: 20px; font-size: 14px; }
        .notice-box { margin-top: 20px; background: #f9f9f9; border: 1px solid #000; padding: 15px; max-height: 200px; overflow-y: auto; }
        .notice-box .notice-item { padding: 5px 0; font-size: 13px; border-bottom: 1px dashed #ccc; }
        .notice-box .notice-item:last-child { border-bottom: none; }
        .logout-btn, .refresh-btn, .edit-btn { background: #fff; color: #000; border: 1px solid #000; padding: 5px 10px; cursor: pointer; font-size: 14px; transition: background 0.2s, color 0.2s; margin-left: 5px; }
        .logout-btn:hover, .refresh-btn:hover, .edit-btn:hover { background: #000; color: #fff; }
        .greeting { font-size: 18px; font-weight: bold; }
        .btn-group { display: flex; gap: 5px; align-items: center; }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .points-value { font-size: 36px; }
            .prize-name, .record-name { font-size: 14px; }
            .section-title { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录界面 -->
        <div id="loginSection" class="login-box">
            <h3>队员登录</h3>
            <div class="warning-box">各队员请勿使用移动数据，若发现超过1GB移动数据使用量，将扣除5个本赛季杯赛积分</div>
            <input type="text" id="accountInput" placeholder="账号">
            <input type="password" id="passwordInput" placeholder="密码">
            <button onclick="loginUser()">登录</button>
        </div>

        <!-- 主界面（登录后显示） -->
        <div id="mainSection" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap;">
                <span class="greeting" id="greetingText">你好，</span>
                <div class="btn-group">
                    <button class="edit-btn" onclick="changePassword()">修改密码</button>
                    <button class="edit-btn" onclick="changeName()">修改用户名</button>
                    <button class="refresh-btn" onclick="loadAll()">刷新</button>
                    <button class="logout-btn" onclick="logoutUser()">退出</button>
                </div>
            </div>
            <div class="warning-box">各队员请勿使用移动数据，若发现超过1GB移动数据使用量，将扣除5个本赛季杯赛积分</div>
            <div class="points-card">
                <div class="points-label">我的积分</div>
                <div class="points-value" id="pointsDisplay">0</div>
            </div>

            <div class="section-title">可兑换奖品</div>
            <div id="prizeList"><div class="loading">加载中...</div></div>

            <div class="section-title">我的兑换记录</div>
            <div id="recordList"><div class="loading">加载中...</div></div>

            <div class="section-title">管理员通知区</div>
            <div class="notice-box" id="noticeBox"><div class="loading">加载中...</div></div>
        </div>
    </div>

    <script>
        //网页配置
        var SUPABASE_URL = 'https://hjktfecloctfpaoohzax.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqa3RmZWNsb2N0ZnBhb29oemF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4ODQ5MzksImV4cCI6MjEwMjQ2MDkzOX0.Kd94mBz7-2EX9Xu3HZUKawIgUWCrVbFsH7rXFyz7WUg';

        function getHeaders() {
            return {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json'
            };
        }

        async function apiFetch(path, options) {
            options = options || {};
            options.headers = getHeaders();
            var response = await fetch(SUPABASE_URL + path, options);
            if (!response.ok) {
                var errorText = await response.text();
                console.error('API错误 ' + response.status + ':', errorText);
                throw new Error('API错误 ' + response.status);
            }
            return await response.json();
        }

        var currentUser = null;

        //用户登录脚本
        async function loginUser() {
            var account = document.getElementById('accountInput').value.trim();
            var password = document.getElementById('passwordInput').value.trim();
            if (!account || !password) {
                alert('请输入账号和密码');
                return;
            }

            try {
                var data = await apiFetch('/rest/v1/rpc/login_user', {
                    method: 'POST',
                    body: JSON.stringify({ p_account: account, p_password: password })
                });

                if (data && data.success) {
                    currentUser = {
                        id: data.user_id,
                        name: data.name,
                        points: data.points
                    };
                    // 保存登录状态到 localStorage
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showMainSection();
                } else {
                    alert(data.msg || '账号或密码错误');
                }
            } catch (e) {
                console.error('登录失败:', e);
                alert('登录失败，请检查网络或配置');
            }
        }

        function showMainSection() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('greetingText').textContent = '你好，' + currentUser.name;
            document.getElementById('pointsDisplay').textContent = currentUser.points;
            loadAll();
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
            document.getElementById('accountInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        //修改密码脚本
        async function changePassword() {
            if (!currentUser) return;
            var oldPassword = prompt('请输入原密码：');
            if (!oldPassword) return;
            var newPassword = prompt('请输入新密码：');
            if (!newPassword) return;
            var confirmPassword = prompt('请再次输入新密码：');
            if (newPassword !== confirmPassword) {
                alert('两次输入的新密码不一致');
                return;
            }

            try {
                var data = await apiFetch('/rest/v1/rpc/update_password', {
                    method: 'POST',
                    body: JSON.stringify({
                        p_user_id: currentUser.id,
                        p_old_password: oldPassword,
                        p_new_password: newPassword
                    })
                });
                if (data && data.success) {
                    alert('密码修改成功，请重新登录');
                    logoutUser(); // 修改密码后强制重新登录
                } else {
                    alert(data.msg || '修改失败');
                }
            } catch (e) {
                console.error('修改密码失败:', e);
                alert('修改失败，请重试');
            }
        }

        //修改用户名脚本
        async function changeName() {
            if (!currentUser) return;
            var newName = prompt('请输入新的用户名：');
            if (!newName) return;

            try {
                var data = await apiFetch('/rest/v1/rpc/update_name', {
                    method: 'POST',
                    body: JSON.stringify({
                        p_user_id: currentUser.id,
                        p_new_name: newName
                    })
                });
                if (data && data.success) {
                    currentUser.name = data.new_name || newName;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    document.getElementById('greetingText').textContent = '你好，' + currentUser.name;
                    alert('用户名修改成功');
                } else {
                    alert(data.msg || '修改失败');
                }
            } catch (e) {
                console.error('修改用户名失败:', e);
                alert('修改失败，请重试');
            }
        }

        //用户加载数据
        async function loadAll() {
            loadPrizes();
            loadRecords();
            loadNotices();
        }

        async function loadPrizes() {
            var container = document.getElementById('prizeList');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                var data = await apiFetch('/rest/v1/prizes?select=*&order=cost.asc');
                if (Array.isArray(data) && data.length > 0) {
                    container.innerHTML = data.map(function(p) {
                        return '<div class="prize-item">' +
                            '<div class="prize-info">' +
                            '<div class="prize-name">' + p.name + '</div>' +
                            '<div class="prize-cost">' + p.cost + ' 积分</div>' +
                            '<div class="prize-stock">剩余 ' + p.stock + ' 件</div>' +
                            '</div>' +
                            '<button class="exchange-btn" onclick="exchangePrize(\'' + p.id + '\')" ' + (p.stock <= 0 ? 'disabled' : '') + '>' +
                            (p.stock <= 0 ? '已兑完' : '兑换') +
                            '</button>' +
                            '</div>';
                    }).join('');
                } else {
                    container.innerHTML = '<div class="empty">暂无奖品</div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="empty">加载奖品失败</div>';
            }
        }

        async function loadRecords() {
            var container = document.getElementById('recordList');
            if (!currentUser) return;
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                var data = await apiFetch('/rest/v1/exchanges?user_id=eq.' + currentUser.id + '&select=*&order=created_at.desc');
                if (Array.isArray(data) && data.length > 0) {
                    container.innerHTML = data.map(function(r) {
                        return '<div class="record-item">' +
                            '<div class="record-info">' +
                            '<div class="record-name">' + r.prize_name + '</div>' +
                            '<div class="record-time">' + new Date(r.created_at).toLocaleString() + '</div>' +
                            '</div>' +
                            '<div class="record-right">' +
                            '<div class="record-cost">-' + r.cost + ' 积分</div>' +
                            '<span class="record-status">' + r.status + '</span>' +
                            '</div>' +
                            '</div>';
                    }).join('');
                } else {
                    container.innerHTML = '<div class="empty">暂无兑换记录</div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="empty">加载记录失败</div>';
            }
        }

        async function loadNotices() {
            var container = document.getElementById('noticeBox');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                var data = await apiFetch('/rest/v1/exchanges?select=*&order=created_at.desc&limit=20');
                if (Array.isArray(data) && data.length > 0) {
                    container.innerHTML = data.map(function(n) {
                        return '<div class="notice-item">【' +
                            new Date(n.created_at).toLocaleString() + '】' +
                            n.prize_name + '，消耗' + n.cost + '积分</div>';
                    }).join('');
                } else {
                    container.innerHTML = '<div class="empty">暂无兑换请求</div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="empty">加载通知失败</div>';
            }
        }

        //用户兑换积分显示
        async function exchangePrize(prizeId) {
            if (!currentUser) return;
            if (!confirm('确定使用积分兑换该奖品吗？')) return;

            try {
                var data = await apiFetch('/rest/v1/rpc/exchange_prize', {
                    method: 'POST',
                    body: JSON.stringify({ p_user_id: currentUser.id, p_prize_id: prizeId })
                });

                if (data && data.success) {
                    alert('兑换成功！');
                    currentUser.points -= data.cost;
                    document.getElementById('pointsDisplay').textContent = currentUser.points;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    loadPrizes();
                    loadRecords();
                    loadNotices();
                } else {
                    alert(data.msg || '兑换失败');
                }
            } catch (e) {
                console.error('兑换失败:', e);
                alert('兑换失败，请重试');
            }
        }

        //自动登录脚本
        (function autoLogin() {
            var saved = localStorage.getItem('currentUser');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    showMainSection();
                } catch (e) {
                    localStorage.removeItem('currentUser');
                }
            }
        })();
    </script>
</body>
</html>
